name: Gerar APK v4 (Wi-Fi do totem)
on:
  workflow_dispatch:
    inputs:
      wifi_senha:
        description: Senha do Wi-Fi Totem-Presenca (so letras e numeros, minimo 8)
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Aplicar troca de senha e Wi-Fi do totem
        run: |
          cat .github/wifi-p1.b64 .github/wifi-p2.b64 | base64 -d | gunzip | git apply
          git status --short
      - name: Senha do Wi-Fi
        env:
          SENHA: ${{ inputs.wifi_senha }}
        run: |
          echo "$SENHA" | grep -Eq '^[A-Za-z0-9]{8,63}$' || { echo "Senha invalida: use 8 a 63 letras/numeros"; exit 1; }
          perl -pi -e 's/SENHA_WIFI_TOTEM/$ENV{SENHA}/' app/src/main/java/com/example/apknfc/auth/TotemWifi.kt
      - name: Apontar para o Pi (10.42.0.1) e liberar HTTP
        run: |
          sed -i 's#192.168.0.10#10.42.0.1#g' app/src/main/java/com/example/apknfc/auth/RetrofitClient.kt app/src/main/res/xml/network_security_config.xml
          grep -q networkSecurityConfig app/src/main/AndroidManifest.xml || sed -i '0,/<application/s##<application android:networkSecurityConfig="@xml/network_security_config"#' app/src/main/AndroidManifest.xml
          grep -n "10.42.0.1" app/src/main/java/com/example/apknfc/auth/RetrofitClient.kt app/src/main/res/xml/network_security_config.xml
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-presenca-wifi-totem
          path: app/build/outputs/apk/debug/*.apk
