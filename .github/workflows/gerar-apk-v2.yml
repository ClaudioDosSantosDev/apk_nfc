name: Gerar APK v2
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Apontar para o Pi e liberar HTTP na rede local
        run: |
          sed -i 's#192.168.0.10#192.168.100.15#g' app/src/main/java/com/example/apknfc/auth/RetrofitClient.kt app/src/main/res/xml/network_security_config.xml
          grep -q networkSecurityConfig app/src/main/AndroidManifest.xml || sed -i '0,/<application/s##<application android:networkSecurityConfig="@xml/network_security_config"#' app/src/main/AndroidManifest.xml
          grep -n "192.168" app/src/main/java/com/example/apknfc/auth/RetrofitClient.kt app/src/main/res/xml/network_security_config.xml
          grep -n "<application" app/src/main/AndroidManifest.xml
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-presenca-v2
          path: app/build/outputs/apk/debug/*.apk
